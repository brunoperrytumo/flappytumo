<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="game.js"></script>
</head>

<body>

  <main>
    <canvas width="150" height="250"></canvas>

    <div id="ui">
      <div id="main"></div>
      <div id="highscores"></div>
      <div id="game">
        <button id="left-button">
          <svg width="32" height="32" viewBox="0 0 4 5" style="fill:white;rotate:180deg">
            <path d="M2,5l-2,0l0,-5l2,0l0,1l1,0l0,1l1,-0l0,1l-1,0l0,1l-1,0l0,1Z" />
          </svg>
        </button>
        <button id="right-button">
          <svg width="32" height="32" viewBox="0 0 4 5" fill="white">
            <path d="M2,5l-2,0l0,-5l2,0l0,1l1,0l0,1l1,-0l0,1l-1,0l0,1l-1,0l0,1Z" />
          </svg>
        </button>
      </div>
    </div>
  </main>
</body>

</html>
