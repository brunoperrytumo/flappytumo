<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flappy Tumo!</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="game.js"></script>
</head>

<body>
    <main>
        <img id="background" src="assets/BG.png" />
        <div id="menu-container">
            <h1>Flappy Tumo!</h1>
            <div class="buttons-container">
                <button id="play-button">JOGAR</button>
                <button id="scores-button">SCORES</button>
            </div>
        </div>
        <div id="game-container">
            <canvas width="150" height="250"></canvas>
            <h2 id="score-label">0</h2>

            <div id="game-ui">
                <h3 id="gameover-label">PERDESTE!</h3>
                <div id="score-input" class="pixel-corners ">
                    <h4>Novo Highscore!</h4>
                    <input id="name-input" type="text" maxlength="3" placeholder="Nome">
                    <button id="submit-score-button" class="disabled">ENVIAR</button>
                </div>
                <div class="buttons-container">
                    <button id="restart-button">RECOMECAR</button>
                    <button id="home-button">INICIO</button>
                </div>
            </div>
            <button id="play-pause-button">
                <svg id="pause-icon" width="25" height="25" viewBox="0 0 5 5" fill="white">
                    <rect x="0" y="0" width="2" height="5" />
                    <rect x="3" y="0" width="2" height="5" />
                </svg>

                <svg id="play-icon" width="25" height="25" viewBox="0 0 4 5" fill="white">
                    <path d="M2,5l-2,0l0,-5l2,0l0,1l1,0l0,1l1,-0l0,1l-1,0l0,1l-1,0l0,1Z" />
                </svg>
            </button>
        </div>
        <div id="highscores-container">
            <div class="scores pixel-corners">
                <div class="left">
                    <label>Name</label>
                </div>
                <div class="right">
                    <label>Score</label>
                </div>
            </div>
            <button id="back-button">VOLTAR</button>
        </div>
    </main>
    <div id="loader">
        <svg width="32" height="32" viewBox="0 0 6 6">
            <path fill="white"
                d="M0,4l0,-2l1,0l-0,2l-1,0Zm1,-2l0,-1l1,0l0,1l-1,0Zm1,-1l0,-1l2,0l0,1l-2,0Zm2,0l1,0l0,1l-1,0l0,-1Zm1,1l1,0l0,2l-1,0l0,-2Zm0,2l0,1l-1,0l0,-1l1,0Zm-1,1l0,1l-2,0l0,-1l2,0Zm-2,0l-1,0l-0,-1l1,0l0,1Z" />
        </svg>
        <label>AGUARDAR...</label>
    </div>
</body>

</html>
