<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flappy Tumo!</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="game.js"></script>
</head>

<body>
    <main>
        <img id="background" src="assets/BG.png" />
        <div id="menu-container">
            <h1>Flappy Tumo!</h1>
            <div id="buttons-container">
                <button id="play-button">
                    <img src="assets/play_button.png" />
                </button>
                <button id="scores-button">
                    <img src="assets/scores_button.png" />
                </button>
            </div>
        </div>
        <div id="game-container">
            <canvas width="150" height="250"></canvas>
            <h2 id="scores-label">0</h2>
            <h3 id="gameover-label">GAME OVER!</h3>
        </div>

        <div id="highscores-container">
            <div class="scores">
                <div class="left">
                    <label>Name</label>
                </div>
                <div class="right">
                    <label>Score</label>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
